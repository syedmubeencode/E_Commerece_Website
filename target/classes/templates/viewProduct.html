<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Product Details</title>

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Font Awesome for icons -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

	<!-- Optional: Custom Styling -->
	<style>
		img.product-img {
			object-fit: cover;
			border-radius: 0.5rem;
		}
	</style>
</head>

<body>

	<!-- ======================= NAVBAR ======================= -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container-fluid">
			<!-- Website Logo -->
			<a class="navbar-brand" href="#">
				<img th:src="@{/images/logo.png}" src="../static/images/logo.png" height="40" alt="Logo">
			</a>

			<!-- Toggle for mobile view -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
				aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- Navigation Links -->
			<div class="collapse navbar-collapse" id="navbarMain">
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<!-- Home -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/}"><i class="fas fa-home"></i> Home</a>
					</li>
					<!-- Shop -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/shop}"><i class="fas fa-store"></i> Shop</a>
					</li>
					<!-- Login (only for anonymous users) -->
					<li class="nav-item" sec:authorize="isAnonymous()">
						<a class="nav-link" th:href="@{/login}"><i class="fas fa-sign-in-alt"></i> Login</a>
					</li>
					<!-- Logout (only for authenticated users) -->
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Logout</a>
					</li>
					<!-- Cart -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/cart}"><i class="fas fa-shopping-cart"></i> Cart</a>
					</li>
					<!-- Cart Count -->
					<li class="nav-item">
						<span class="nav-link text-warning" th:text="${cartCount}"></span>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- ======================= PRODUCT DETAILS ======================= -->
	<div class="container mt-5">
		<div class="row align-items-center">
			<!-- Left: Product Image -->
			<div class="col-md-5 text-center">
				<img class="product-img" height="300" width="300" th:src="@{${'/productImages/' + product.imageName}}"
					alt="Product Image">
			</div>

			<!-- Right: Product Information -->
			<div class="col-md-7 mt-4 mt-md-0">
				<!-- Product Name -->
				<h2 th:text="${product.name}">Product Name</h2>

				<!-- Product Category -->
				<p class="text-muted" th:text="${product.category.name}">Category Name</p>

				<!-- Product Price -->
				<h3 class="text-success">
					₹ <span th:text="${product.price}">0</span>
				</h3>

				<!-- Product Weight -->
				<h5>Weight: <span th:text="${product.weight}">0</span> grams</h5>

				<!-- Product Description -->
				<p th:text="${product.description}">Product Description</p>

				<!-- Add to Cart Button -->
				<a class="btn btn-primary" th:href="@{/addToCart/{id}(id=${product.id})}">
					<i class="fas fa-cart-plus"></i> Add to Cart
				</a>
			</div>
		</div>
	</div>

	<!-- ======================= SCRIPTS ======================= -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
