<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity5">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Shop | ShopZone</title>

	<!-- Bootstrap 5 CSS for styling -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Font Awesome for icons -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

	<!-- Custom CSS for hover effects and card design -->
	<style>
		.product-card {
			transition: transform 0.2s;
		}

		.product-card:hover {
			transform: scale(1.02);
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
		}

		.category-link {
			text-decoration: none;
			color: #333;
		}

		.category-link:hover {
			background-color: #f8f9fa;
			font-weight: bold;
		}

		.product-image {
			object-fit: cover;
			width: 100%;
			height: 200px;
			border-radius: 0.25rem;
		}
	</style>
</head>

<body>

	<!-- ====================== NAVIGATION BAR ====================== -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
		<div class="container">
			<!-- Logo and Brand -->
			<a class="navbar-brand" href="#">
				<img th:src="@{/images/logo.png}" src="../static/images/logo.png" alt="Logo" height="40" />
				ShopZone
			</a>

			<!-- Hamburger Menu for Mobile -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- Navigation Links -->
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<!-- Home -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/}"><i class="fas fa-home"></i> Home</a>
					</li>

					<!-- Shop -->
					<li class="nav-item">
						<a class="nav-link active" th:href="@{/shop}"><i class="fas fa-store"></i> Shop</a>
					</li>

					<!-- Login/Logout -->
					<li class="nav-item" sec:authorize="isAnonymous()">
						<a class="nav-link" th:href="@{/login}"><i class="fas fa-sign-in-alt"></i> Login</a>
					</li>

					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Logout</a>
					</li>

					<!-- Cart -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/cart}"><i class="fas fa-shopping-cart"></i> Cart</a>
					</li>

					<!-- Cart Count -->
					<li class="nav-item">
						<span class="nav-link text-warning"><i class="fas fa-box"></i> <span
								th:text="${cartCount}">0</span></span>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- ====================== MAIN SHOP CONTENT ====================== -->
	<div class="container py-5">
		<div class="row">
			<!-- ============ SIDEBAR: CATEGORY LIST ============ -->
			<div class="col-lg-3 mb-4">
				<h5 class="mb-3">Categories</h5>
				<ul class="list-group">
					<!-- Link to show all products -->
					<li class="list-group-item category-link">
						<a class="text-decoration-none" th:href="@{/shop}">All Products</a>
					</li>

					<!-- List of categories dynamically rendered -->
					<li class="list-group-item category-link" th:each="category : ${categories}">
						<a class="text-decoration-none" th:href="@{/shop/category/{id}(id=${category.id})}"
							th:text="${category.name}"></a>
					</li>
				</ul>
			</div>

			<!-- ============ PRODUCT GRID ============ -->
			<div class="col-lg-9">
				<div class="row g-4" th:if="${products != null}" th:each="product : ${products}">
					<div class="col-md-6 col-lg-4">
						<div class="card product-card h-100 shadow-sm">
							<!-- Product image -->
							<img class="product-image card-img-top" th:src="@{${'/productImages/' + product.imageName}}"
								th:alt="${product.name}" />

							<!-- Product details -->
							<div class="card-body d-flex flex-column">
								<h5 class="card-title" th:text="${product.name}"></h5>
								<h6 class="text-primary">₹ <span th:text="${product.price}"></span></h6>
								<p class="card-text small text-muted" th:text="${product.description}">Product
									description</p>

								<!-- View Product Button -->
								<a class="btn btn-outline-primary mt-auto"
									th:href="@{/shop/viewproduct/{id}(id=${product.id})}">
									<i class="fas fa-eye"></i> View Product
								</a>
							</div>
						</div>
					</div>
				</div>

				<!-- Message when there are no products -->
				<div th:if="${#lists.isEmpty(products)}" class="text-center mt-5">
					<h4>No products available.</h4>
				</div>
			</div>
		</div>
	</div>

	<!-- ====================== FOOTER ====================== -->
	<footer class="bg-dark text-white py-4 mt-5 text-center">
		<div class="container">
			<small>Made with ❤️ using Spring Boot & Thymeleaf</small>
		</div>
	</footer>

	<!-- ====================== BOOTSTRAP SCRIPT ====================== -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
