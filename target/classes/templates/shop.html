<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity5">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Shop | ShopZone</title>

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Font Awesome -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

	<!-- Custom CSS -->
	<style>
		/* Product Card styling */
		.product-card {
			transition: transform 0.3s ease, box-shadow 0.3s ease;
		}

		/* Card hover effect */
		.product-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
		}

		.product-image {
			object-fit: cover;
			width: 100%;
			height: 220px;
			border-radius: 0.25rem;
		}

		.category-link {
			text-decoration: none;
			color: #333;
			transition: background-color 0.3s ease, font-weight 0.3s ease;
		}

		.category-link:hover {
			background-color: #f1f1f1;
			font-weight: bold;
		}
	</style>
</head>

<body>

	<!-- ====================== SIMPLE NAVBAR ====================== -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
		<div class="container">
			<!-- Brand -->
			<a class="navbar-brand" href="#" th:href="@{/}">ShopZone</a>

			<!-- Hamburger Menu -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- Links -->
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
					<li class="nav-item"><a class="nav-link active" th:href="@{/shop}">Shop</a></li>
					<li class="nav-item" sec:authorize="isAnonymous()">
						<a class="nav-link" th:href="@{/login}">Login</a>
					</li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/logout}">Logout</a>
					</li>
					<li class="nav-item"><a class="nav-link" th:href="@{/cart}">Cart</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- ====================== SHOP CONTENT ====================== -->
	<div class="container py-5">
		<div class="row">
			<!-- Sidebar -->
			<div class="col-lg-3 mb-4">
				<h5 class="mb-3">Categories</h5>
				<ul class="list-group">
					<li class="list-group-item category-link">
						<a class="text-decoration-none" th:href="@{/shop}">All Products</a>
					</li>
					<li class="list-group-item category-link" th:each="category : ${categories}">
						<a class="text-decoration-none" th:href="@{/shop/category/{id}(id=${category.id})}"
							th:text="${category.name}"></a>
					</li>
				</ul>
			</div>

			<!-- Product Grid (2 per row always) -->
			<div class="col-lg-9">
				<div class="row g-4" th:if="${products != null}" th:each="product : ${products}">
					<div class="col-md-6 col-lg-6">
						<div class="card product-card h-100 shadow-sm">
							<img class="product-image card-img-top" th:src="@{${'/productImages/' + product.imageName}}"
								th:alt="${product.name}" />
							<div class="card-body d-flex flex-column">
								<h5 class="card-title" th:text="${product.name}"></h5>
								<h6 class="text-primary">₹ <span th:text="${product.price}"></span></h6>
								<p class="card-text small text-muted" th:text="${product.description}"></p>
								<a class="btn btn-outline-primary mt-auto"
									th:href="@{/shop/viewproduct/{id}(id=${product.id})}">
									View Product
								</a>
							</div>
						</div>
					</div>
				</div>

				<!-- No Products -->
				<div th:if="${#lists.isEmpty(products)}" class="text-center mt-5">
					<h4>No products available.</h4>
				</div>
			</div>
		</div>
	</div>

	<!-- ====================== FOOTER ====================== -->
	<footer class="bg-dark text-white py-4 mt-5 text-center">
		<div class="container">
			<small>Made with ❤️ using Spring Boot & Thymeleaf</small>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
