<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">

    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
        }

        /* Navbar */
        .navbar {
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Welcome Section */
        .welcome {
            padding: 40px 20px;
            text-align: center;
        }

        /* Dashboard Cards */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
        }

        .card i {
            transition: transform 0.3s ease;
        }

        .card:hover i {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand font-weight-bold" th:href="@{/}">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Simple Header Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Welcome Text -->
    <div class="welcome">
        <h1 class="display-5">Welcome Admin 👋</h1>
        <p class="text-muted">Manage your categories, products, and users with ease.</p>
    </div>

    <!-- Dashboard Options -->
    <div class="container pb-5">
        <div class="row text-center">

            <!-- Categories -->
            <div class="col-md-4 mb-4">
                <div class="card p-4">
                    <i class="fas fa-list fa-2x text-primary mb-3"></i>
                    <h5>Categories</h5>
                    <p class="small text-muted">Manage product categories</p>
                    <a th:href="@{/admin/categories}" class="btn btn-outline-primary btn-sm">Manage</a>
                </div>
            </div>

            <!-- Products -->
            <div class="col-md-4 mb-4">
                <div class="card p-4">
                    <i class="fas fa-box-open fa-2x text-success mb-3"></i>
                    <h5>Products</h5>
                    <p class="small text-muted">View & update products</p>
                    <a th:href="@{/admin/products}" class="btn btn-outline-success btn-sm">Manage</a>
                </div>
            </div>

            <!-- Users -->
            <div class="col-md-4 mb-4">
                <div class="card p-4">
                    <i class="fas fa-users fa-2x text-info mb-3"></i>
                    <h5>Users</h5>
                    <p class="small text-muted">Manage users & roles</p>
                    <a th:href="@{/admin/users}" class="btn btn-outline-info btn-sm">Manage</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
</body>

</html>
