<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin | Product Management</title>

	<!-- Bootstrap 5 CSS for styling -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Font Awesome (optional, for icons) -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

	<!-- Custom styles for product table -->
	<style>
		.product-img {
			object-fit: cover;
			border-radius: 0.25rem;
		}
	</style>
</head>

<body>

	<!-- ======================= NAVBAR ======================= -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
		<div class="container-fluid">
			<!-- Logo -->
			<a class="navbar-brand" href="#">
				<img th:src="@{/images/logo.png}" src="../static/images/logo.png" alt="Logo" height="40" />
				AdminPanel
			</a>

			<!-- Toggle button for mobile -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAdmin"
				aria-controls="navbarAdmin" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- Admin navigation links -->
			<div class="collapse navbar-collapse" id="navbarAdmin">
				<ul class="navbar-nav ms-auto">
					<!-- Admin Home -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/admin}"><i class="fas fa-tachometer-alt"></i> Admin Home</a>
					</li>

					<!-- Logout -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Logout</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- ======================= MAIN CONTENT ======================= -->
	<div class="container py-5">

		<!-- Add New Product Button -->
		<div class="mb-3">
			<a th:href="@{/admin/products/add}" class="btn btn-primary">
				<i class="fas fa-plus"></i> Add Product
			</a>
		</div>

		<!-- Products Table -->
		<div class="table-responsive">
			<table class="table table-bordered table-hover align-middle">
				<thead class="table-dark">
					<tr>
						<th scope="col">SN</th>
						<th scope="col">Product Name</th>
						<th scope="col">Category</th>
						<th scope="col">Preview</th>
						<th scope="col">Delete</th>
						<th scope="col">Update</th>
					</tr>
				</thead>
				<tbody>
					<!-- Loop through all products and render one row each -->
					<tr th:each="product, iStat : ${products}">
						<!-- Serial number -->
						<th scope="row" th:text="${iStat.index + 1}">1</th>

						<!-- Product name -->
						<td th:text="${product.name}">Product Name</td>

						<!-- Category name -->
						<td th:text="${product.category.name}">Category</td>

						<!-- Product image preview -->
						<td>
							<img th:src="@{${'/productImages/' + product.imageName}}" src="" height="100" width="100"
								class="product-img" />
						</td>

						<!-- Delete button -->
						<td>
							<a th:href="@{/admin/product/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm">
								<i class="fas fa-trash"></i> Delete
							</a>
						</td>

						<!-- Update button -->
						<td>
							<a th:href="@{/admin/product/update/{id}(id=${product.id})}" class="btn btn-warning btn-sm">
								<i class="fas fa-edit"></i> Update
							</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>

	<!-- ======================= BOOTSTRAP JS ======================= -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
