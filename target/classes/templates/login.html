<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>

	<!-- Bootstrap -->
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">

	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f9f9f9;
		}

		/* Navbar */
		.navbar {
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		}

		/* Login Container */
		.login-container {
			min-height: 80vh;
			/* center vertically */
			display: flex;
			justify-content: center;
			align-items: center;
		}

		/* Login Card */
		.login-card {
			background: #fff;
			padding: 30px;
			border-radius: 8px;
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
			width: 100%;
			max-width: 400px;
		}

		/* Hover animation for buttons */
		.btn {
			transition: transform 0.3s ease, box-shadow 0.3s ease;
		}

		.btn:hover {
			transform: translateY(-3px);
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
		}

		.extra-links {
			margin-top: 15px;
			font-size: 0.9rem;
		}

		.extra-links a {
			text-decoration: none;
		}
	</style>
</head>

<body>

	<!-- Header -->
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container">
			<a class="navbar-brand font-weight-bold" th:href="@{/}">MyShop</a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- Simple Nav -->
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ml-auto">
					<li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/shop}">Shop</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/register}">Sign Up</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- Login Section -->
	<div class="login-container">
		<div class="login-card">
			<h3 class="text-center mb-4">Login</h3>

			<!-- Login Form -->
			<form th:action="@{/login}" method="post">
				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" name="email" id="email" class="form-control form-control-lg"
						placeholder="Your Email">
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" name="password" id="password" class="form-control form-control-lg"
						placeholder="Password">
				</div>

				<!-- Error message -->
				<div th:if="${param.error}" class="alert alert-danger small">
					Invalid username or password.
				</div>

				<button type="submit" class="btn btn-primary btn-block">Login</button>
			</form>

			<!-- Extra links -->
			<div class="extra-links text-center">
				<p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
				<p><a th:href="@{/forgotpassword}">Forgot password?</a></p>
			</div>

			<hr>

			<!-- Google Login -->
			<div class="text-center">
				<a href="/oauth2/authorization/google" class="btn btn-danger btn-block">
					<i class="fab fa-google"></i> Sign in with Google
				</a>
			</div>
		</div>
	</div>

	<!-- Scripts -->
	<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
</body>

</html>
